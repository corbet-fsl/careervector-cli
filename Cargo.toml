[package]
name = "careervector-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Local-first, deterministic CV and cover-letter compiler"
license = "FSL-1.1-ALv2"
publish = false
build = ".agent/build.rs"

[workspace]
resolver = "3"

[lib]
name = "careervector_cli"
path = ".agent/src/lib.rs"

[[bin]]
name = "cv"
path = ".agent/src/main.rs"

# Maintainer release and private downstream routes are tested through the real CLI.
[[test]]
name = "release_evidence"
path = ".agent/tests/release_evidence.rs"

[[test]]
name = "private_check"
path = ".agent/tests/private_check.rs"

[[test]]
name = "cli_commands"
path = ".agent/tests/cli_commands.rs"

[dependencies]
anyhow = "1.0"
ccvl-engine = { package = "ccvl", version = "0.1", features = ["render"] }
cletter = "0.4.4"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
ctypst = { version = "0.3.6", default-features = false, features = ["document-fonts", "format", "pdf", "raster"] }
lopdf = { version = "0.44", default-features = false }
png = "0.18"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
toml = "1.1"
ureq = { version = "3.1", default-features = false, features = ["json", "rustls"] }
walkdir = "2.5"

[dev-dependencies]
pretty_assertions = "1.4"

[build-dependencies]
serde_json = "1.0"
sha2 = "0.10"

# No [profile] table: the fleet profile is the only profile in this manifest.
# The release jobs pass .cargo/release-profile.toml with --config instead
# (build-efficiency rule 2).

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
